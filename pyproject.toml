[project]
name = "querymind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hasshya1530", email = "hasshyamoorthy1530@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
